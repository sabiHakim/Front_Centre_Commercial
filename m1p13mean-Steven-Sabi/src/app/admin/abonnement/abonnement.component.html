<div class="max-w-4xl mx-auto mt-6">
  <h2 class="text-xl font-bold mb-4">Gestion des abonnements</h2>

  <!-- Formulaire Ajout / Edition -->
  <div class="bg-white p-5 rounded-xl shadow mb-6">
    <h3 class="font-semibold mb-2">
      {{ editId ? "Modifier" : "Ajouter" }} un abonnement
    </h3>
    <div class="flex flex-col gap-3">
      <input
        type="text"
        [(ngModel)]="label"
        placeholder="Label"
        class="border rounded px-3 py-2"
      />
      <input
        type="number"
        [(ngModel)]="montant"
        placeholder="Montant"
        class="border rounded px-3 py-2"
      />
      <input
        type="text"
        [(ngModel)]="description"
        placeholder="Description"
        class="border rounded px-3 py-2"
      />
      <input
        type="number"
        [(ngModel)]="prioriter"
        placeholder="Priorité"
        class="border rounded px-3 py-2"
      />
      <input type="date" [(ngModel)]="date" class="border rounded px-3 py-2" />
      <button
        (click)="submit()"
        [disabled]="!label || !montant || !description || !prioriter || !date"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ editId ? "Modifier" : "Ajouter" }}
      </button>

      <button
        *ngIf="editId"
        (click)="resetForm()"
        class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400"
      >
        Annuler
      </button>
    </div>
  </div>

  <!-- Tableau abonnements -->
  <div class="bg-white p-5 rounded-xl shadow">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-50 uppercase text-gray-600">
        <tr>
          <th class="px-4 py-2 text-left">Label</th>
          <th class="px-4 py-2 text-center">Montant</th>
          <th class="px-4 py-2 text-center">Description</th>
          <th class="px-4 py-2 text-center">Priorité</th>
          <th class="px-4 py-2 text-center">Date</th>
          <th class="px-4 py-2 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of abonnements" class="border-t hover:bg-gray-50">
          <td class="px-4 py-2">{{ a.label }}</td>
          <td class="px-4 py-2 text-center">{{ a.montant | number }} Ar</td>
          <td class="px-4 py-2 text-center">{{ a.description }}</td>
          <td class="px-4 py-2 text-center">{{ a.prioriter }}</td>
          <td class="px-4 py-2 text-center">{{ a.date }}</td>
          <td
            class="px-4 py-2 text-center flex justify-center gap-2 items-center"
          >
            <!-- Modifier -->
            <button
              (click)="edit(a)"
              class="bg-yellow-400 p-2 rounded hover:bg-yellow-500"
              title="Modifier"
            >
              <lucide-angular
                [img]="Edit2"
                size="18"
                class="text-white"
              ></lucide-angular>
            </button>

            <!-- Supprimer -->
            <button
              (click)="delete(a.id)"
              class="bg-red-600 p-2 rounded hover:bg-red-700"
              title="Supprimer"
            >
              <lucide-angular
                [img]="Trash2"
                size="18"
                class="text-white"
              ></lucide-angular>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
