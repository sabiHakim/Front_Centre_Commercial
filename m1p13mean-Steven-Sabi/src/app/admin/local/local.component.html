<div class="max-w-4xl mx-auto mt-6">
  <h2 class="text-2xl font-bold mb-4">Gestion des locaux</h2>

  <!-- Formulaire Ajout / Edition -->
  <div class="bg-white p-5 rounded-xl shadow mb-6">
    <h3 class="font-semibold mb-2">
      {{ editId ? "Modifier" : "Ajouter" }} un local
    </h3>
    <div class="flex flex-col gap-3">
      <input
        type="text"
        [(ngModel)]="taille"
        placeholder="Taille"
        class="border rounded px-3 py-2"
      />
      <input
        type="text"
        [(ngModel)]="position"
        placeholder="Position"
        class="border rounded px-3 py-2"
      />
      <input
        type="number"
        [(ngModel)]="loyer"
        placeholder="Loyer"
        class="border rounded px-3 py-2"
      />
      <select [(ngModel)]="etat" class="border rounded px-3 py-2">
        <option value="libre">Libre</option>
        <option value="occupé">Occupé</option>
      </select>

      <button
        (click)="submit()"
        [disabled]="!taille || !position || !loyer || !etat"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ editId ? "Modifier" : "Ajouter" }}
      </button>
      <button
        *ngIf="editId"
        (click)="resetForm()"
        class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400"
      >
        Annuler
      </button>
    </div>
  </div>

  <!-- Tableau locaux -->
  <div class="bg-white p-5 rounded-xl shadow">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-50 uppercase text-gray-600">
        <tr>
          <th class="px-4 py-2 text-left">Taille</th>
          <th class="px-4 py-2 text-center">Position</th>
          <th class="px-4 py-2 text-center">Loyer</th>
          <th class="px-4 py-2 text-center">Etat</th>
          <th class="px-4 py-2 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let l of locaux" class="border-t hover:bg-gray-50">
          <td class="px-4 py-2">{{ l.taille }}</td>
          <td class="px-4 py-2 text-center">{{ l.position }}</td>
          <td class="px-4 py-2 text-center">{{ l.loyer | number }} Ar</td>
          <td class="px-4 py-2 text-center">
            <span
              [ngClass]="
                l.etat === 'libre'
                  ? 'text-green-600 font-semibold'
                  : 'text-red-600 font-semibold'
              "
            >
              {{ l.etat }}
            </span>
          </td>
          <td
            class="px-4 py-2 text-center flex justify-center gap-2 items-center"
          >
            <button
              (click)="edit(l)"
              class="bg-yellow-400 p-2 rounded hover:bg-yellow-500"
              title="Modifier"
            >
              <lucide-angular
                [img]="Edit2"
                size="18"
                class="text-white"
              ></lucide-angular>
            </button>
            <button
              (click)="delete(l.id)"
              class="bg-red-600 p-2 rounded hover:bg-red-700"
              title="Supprimer"
            >
              <lucide-angular
                [img]="Trash2"
                size="18"
                class="text-white"
              ></lucide-angular>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
