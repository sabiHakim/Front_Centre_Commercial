<!-- Header avec bouton Ajouter -->
<div class="flex items-center justify-center gap-3 mb-4">
  <h2 class="text-xl font-semibold">Mes produits</h2>
  <button
    class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded"
    (click)="ouvrirModal()"
  >
    <lucide-angular [img]="PackageIcon" size="16"></lucide-angular>
    Ajouter
  </button>
</div>

<!-- Grille produits -->
<div
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
>
  <div
    *ngFor="let produit of produits"
    class="bg-white shadow-md rounded-xl p-4 flex flex-col hover:shadow-lg"
  >
    <img
      [src]="produit.image"
      alt="{{ produit.nom }}"
      class="w-full h-40 object-cover rounded-lg mb-3"
    />
    <h3 class="font-semibold">{{ produit.nom }}</h3>
    <p class="text-sm text-gray-500 line-clamp-2">{{ produit.description }}</p>
    <p class="font-bold text-blue-700 mt-2">{{ produit.prix | number }} Ar</p>
    <p class="text-sm text-gray-600">Stock: {{ produit.stock }}</p>

    <div class="mt-3 flex justify-between gap-2">
      <button
        class="flex items-center gap-1 px-3 py-1 rounded bg-blue-500 hover:bg-blue-600 text-white"
        (click)="modifierProduit(produit)"
      >
        <lucide-angular [img]="EditIcon" size="16"></lucide-angular>
        Modifier
      </button>
      <button
        class="flex items-center gap-1 px-3 py-1 rounded bg-red-600 hover:bg-red-700 text-white"
        (click)="supprimerProduit(produit.id)"
      >
        <lucide-angular [img]="TrashIcon" size="16"></lucide-angular>
        Supprimer
      </button>
    </div>
  </div>
</div>

<!-- Modal -->
<div
  *ngIf="modalOuvert"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
>
  <!-- Card modal -->
  <div
    class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 relative animate-fade-in"
  >
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-lg font-semibold text-gray-800">Ajouter un produit</h3>
      <button
        (click)="fermerModal()"
        class="text-gray-400 hover:text-gray-700 text-2xl leading-none"
      >
        &times;
      </button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="confirmerAjout()" class="space-y-4">
      <!-- Nom -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Nom du produit
        </label>
        <input
          type="text"
          [(ngModel)]="nouveauProduit.nom"
          name="nom"
          required
          class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Description
        </label>
        <textarea
          rows="3"
          [(ngModel)]="nouveauProduit.description"
          name="description"
          class="w-full rounded-lg border px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-green-500"
        ></textarea>
      </div>

      <!-- Prix & Stock -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Prix (Ar)
          </label>
          <input
            type="number"
            [(ngModel)]="nouveauProduit.prix"
            name="prix"
            required
            class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Stock
          </label>
          <input
            type="number"
            [(ngModel)]="nouveauProduit.stock"
            name="stock"
            required
            class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
      </div>

      <!-- Image -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          URL de l’image
        </label>
        <input
          type="file"
          [(ngModel)]="nouveauProduit.image"
          name="image"
          class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <!-- Footer buttons -->
      <div class="flex justify-end gap-3 pt-4">
        <button
          type="button"
          (click)="fermerModal()"
          class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200"
        >
          Annuler
        </button>
        <button
          type="submit"
          class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700"
        >
          Ajouter
        </button>
      </div>
    </form>
  </div>
</div>
