<div class="max-w-7xl mx-auto p-6">
  <div class="mb-6" *ngIf="myBoutique?.length > 1">

    <!-- Titre -->
    <h2 class="text-xl font-semibold mb-4 text-gray-800">
      Mes boutiques
    </h2>
  
    <!-- Liste des boutiques -->
    <div class="flex flex-wrap gap-3">
  
      <button
        *ngFor="let boutique of myBoutique"
        (click)="setCurrentBoutique(boutique)"
        class="px-5 py-2 rounded-xl shadow-sm text-sm font-medium transition-all duration-200 border"
        [ngClass]="
          currentBoutique?._id === boutique._id
            ? 'bg-indigo-600 text-white scale-105 shadow-lg border-indigo-600'
            : 'bg-white text-gray-700 hover:bg-indigo-50 border-gray-300'
        "
      >
        {{ boutique.nom }}
      </button>
  
    </div>
  
  </div>
  <div class="boutique-card" [style.backgroundImage]="'url(' + currentBoutique.fond + ')'">
    <div class="overlay">
      <img class="logo" [src]="currentBoutique.logo" alt="{{ currentBoutique.nom }} Logo">
      <h1 class="nom">{{ currentBoutique.nom }}</h1>
      <p class="description">{{ currentBoutique.description }}</p>
  
      <!-- Bouton Modifier -->
      <button
        class="edit-button flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow mt-4"
        (click)="ouvrirModal()"
      >
      <span *ngIf="!loading">
        <lucide-angular name="edit" size="16"></lucide-angular>
        Modifier la boutique
      </span>
      <span *ngIf="loading" class="flex items-center gap-2">
        <lucide-angular name="loader" size="16"></lucide-angular>
        Chargement...
      </span>
      </button>
    </div>
  </div>
  <!-- TITRE -->
  <h1 class="text-xl font-semibold mb-6 flex items-center gap-2">
    <lucide-angular [img]="BoxIcon" size="28"></lucide-angular>
    Dashboard Boutique
  </h1>
  <!-- 1️⃣ STATISTIQUES RAPIDES -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
    <!-- Total Produits -->
    <div class="bg-white shadow-md rounded-xl p-6 flex flex-col items-center">
      <lucide-angular
        [img]="PackageIcon"
        size="32"
        class="mb-2 text-blue-600"
      ></lucide-angular>
      <p class="text-2xl font-bold">{{myProduit.length}}</p>
      <p class="text-gray-500">Produits</p>
    </div>
    <!-- Commandes récentes -->
    <div class="bg-white shadow-md rounded-xl p-6 flex flex-col items-center">
      <lucide-angular
        [img]="ShoppingCartIcon"
        size="32"
        class="mb-2 text-green-600"
      ></lucide-angular>
      <p class="text-2xl font-bold">{{myCommande.length}}</p>
      <p class="text-gray-500">Commandes</p>
    </div>
    <!-- Chiffre d'affaires -->
    <!-- <div class="bg-white shadow-md rounded-xl p-6 flex flex-col items-center">
      <lucide-angular
        [img]="CreditCardIcon"
        size="32"
        class="mb-2 text-yellow-600"
      ></lucide-angular>
      <p class="text-2xl font-bold">5 400 000 Ar</p>
      <p class="text-gray-500">Chiffre d'affaires</p>
    </div> -->
    
  </div>
    
  <!-- 2️⃣ COMMANDES RÉCENTES -->

  <div
*ngIf="modalOuvert"
class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
>
<div class="p-4 bg-white rounded-xl shadow-md w-full max-w-md">
  <div class="flex items-center justify-between mb-6">
    <h3 class="text-lg font-semibold text-gray-800">Modifier la boutique</h3>
    <button
      (click)="fermerModal()"
      class="text-gray-400 hover:text-gray-700 text-2xl"
    >
      &times;
    </button>
  </div>
  <div class="flex flex-col gap-4">

    <!-- Date début -->
    <div class="flex flex-col">
      <label class="mb-1 text-gray-600 font-medium">Nom</label>
      <input 
        type="text"
        [(ngModel)]="currentBoutique.nom"
        name = "nom"
        class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div class="flex flex-col">
      <label class="mb-1 text-gray-600 font-medium">Description</label>
      <input 
        type="text"
        [(ngModel)]="currentBoutique.description"
        name = "description"
        class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div class="flex flex-col">
      <label class="mb-1 text-gray-600 font-medium">Logo</label>
      <input 
        type="file"
        (change)="onFileSelectedLogo($event)"
        class="block w-full text-sm text-gray-500
               file:mr-4 file:py-2 file:px-4
               file:rounded-lg file:border-0
               file:text-sm file:font-semibold
               file:bg-indigo-50 file:text-indigo-700
               hover:file:bg-indigo-100"
      />
    </div>

    <div class="flex flex-col">
      <label class="mb-1 text-gray-600 font-medium">Image de fond</label>
      <input 
        type="file"
        (change)="onFileSelectedFont($event)"
        class="block w-full text-sm text-gray-500
               file:mr-4 file:py-2 file:px-4
               file:rounded-lg file:border-0
               file:text-sm file:font-semibold
               file:bg-indigo-50 file:text-indigo-700
               hover:file:bg-indigo-100"
      />
    </div>

    <!-- Bouton -->
    
    <div class="flex justify-end gap-3 pt-4">
      <button
        type="button"
        (click)="fermerModal()"
        class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200"
      >
        Annuler
      </button>

      <button
        type="submit"
        (click)="editBoutique()"
        [disabled]="!currentBoutique.nom || !currentBoutique.description"
        class="w-30 px-4 py-2 rounded-lg text-white transition flex items-center gap-2
      bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
        Ajouter
      </button>
    </div>
  
</div>
