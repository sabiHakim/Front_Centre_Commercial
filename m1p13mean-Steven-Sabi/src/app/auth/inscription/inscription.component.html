<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Créer un compte</h1>
      <p class="mt-2 text-gray-500 text-sm">Inscription rapide et sécurisée</p>
    </div>

    <form #form="ngForm" (ngSubmit)="onSubmit(form)" class="space-y-5">

      <input type="text" name="nom" [(ngModel)]="user.nom" required placeholder="Nom"
        class="input w-full py-3 px-4 border rounded-lg" />

      <input type="text" name="prenom" [(ngModel)]="user.prenom" required placeholder="Prénom"
        class="input w-full py-3 px-4 border rounded-lg" />

      <input type="email" name="email" [(ngModel)]="user.email" required placeholder="Email"
        class="input w-full py-3 px-4 border rounded-lg" />

      <input type="password" name="password" [(ngModel)]="user.password" required 
        placeholder="Mot de passe" class="input w-full py-3 px-4 border rounded-lg" />

      <input type="text" name="contact" [(ngModel)]="user.contact" required placeholder="Contact"
        class="input w-full py-3 px-4 border rounded-lg" />

      <button type="submit" [disabled]="form.invalid || isLoading"
        class="w-full py-3 bg-blue-600 text-white rounded-lg">
        {{ isLoading ? 'Inscription...' : 'S\'inscrire' }}
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Déjà un compte ?
      <a routerLink="/connexion" class="text-blue-600 hover:text-blue-500 font-medium">
        Se connecter
      </a>
    </p>
  </div>
</div>
