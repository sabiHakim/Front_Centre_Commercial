<div
  class="bg-[url('/assets/images/bg.jpg')] bg-cover bg-center bg-no-repeat px-5 py-10 md:py-16 relative text-white"
>
  <!-- Overlay sombre semi-transparent pour lisibilité -->
  <div class="absolute inset-0 bg-black/50"></div>
  <!-- Contenu principal (au-dessus de l'overlay)   mx-auto marge horizontale() -->
  <div class="relative z-10 max-w-2xl mx-auto text-center">
    <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold mb-6">
      Bienvenue au Mall
    </h2>
    <p class="text-lg md:text-xl mb-8 max-w-3xl mx-auto">
      Découvrez nos boutiques et produits
    </p>
    <div class="w-full max-w-md mx-auto my-4">
      <input
        type="text"
        placeholder="Rechercher un produit..."
        [(ngModel)]="searchTerm"
        class="text-black w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
      />
    </div>
  </div>
</div>

<!-- Filtre Catégorie + Total + Panier -->
<div class="flex flex-col sm:flex-row items-center justify-between mb-4 px-8 mt-4">
  <!-- Gauche : catégorie + total -->
  <div class="flex items-center gap-4">
    <!-- Sélecteur catégorie -->
    <select
      class="px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
    >
      <option value="">Sélection Catégorie</option>
      <option value="test1">Test 1</option>
      <option value="test2">Test 2</option>
      <option value="test3">Test 3</option>
    </select>

    <!-- Total produits -->
    <p class="text-sm sm:text-base font-medium text-gray-700">
      Total produit : 0
    </p>
  </div>
  <!-- Droite : bouton Panier -->
  <div>
    <button
      class="bg-blue-800 text-white px-6 py-2 rounded-lg hover:bg-blue-900 transition-colors font-semibold"
    >
     <lucide-angular [img]="StoreIcon" size="18"></lucide-angular>
      Panier
    </button>
  </div>
</div>


<!-- Container grid pour toutes les cartes produits -->
<div
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2 p-8 items-stretch"
>
  <app-card-produit
    *ngFor="let produit of filteredProduits"
    [produit]="produit"
    [boutiqueNom]="getNomBoutique(produit.boutiqueId)"
  >
  </app-card-produit>
</div>
