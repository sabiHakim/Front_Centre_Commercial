
<!-- partie produit -->
<div
  class="bg-white shadow-md rounded-xl p-4 hover:shadow-xl transition-shadow duration-300 max-w-xs flex flex-col h-full"
>
  <!-- Image en haut carrée -->
  <img
    [src]="produit.image"
    alt="{{ produit.nom }}"
    class="w-full aspect-square object-cover rounded-lg mb-4 transform hover:scale-105 transition-transform duration-300"
  />

  <!-- Infos du produit -->
  <div class="flex flex-col justify-between flex-1">
    <div>
      <h3 class="text-xl  font-bold text-gray-800">{{ produit.nom }}</h3>
      <p class="text-sm text-gray-500">Boutique: {{ boutiqueNom }}</p>
      <p class="text-sm text-gray-500 line-clamp-3">
        Description: {{ produit.description }}
      </p>
    </div>

    <div class="mt-2">
      <div class="flex justify-between mb-2">
        <p class="text-sm font-semibold text-blue-600">{{ produit.prix }} Ar</p>
        <p
          class="text-sm font-semibold bg-blue-950 text-white px-2 py-1 rounded-lg"
        >
          Stock: {{ produit.stock }}
        </p>
      </div>

      <button
        class="w-full bg-slate-600 text-white rounded-md py-2 px-4 flex items-center justify-center gap-2 hover:bg-slate-700 transition-colors"
      >
        <lucide-angular [img]="StoreIcon" size="18"></lucide-angular>
        Ajouter Panier
      </button>
    </div>
  </div>
</div>
