<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
    <!-- Titre -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Inscription</h1>
      <p class="mt-2 text-gray-600">Créez votre compte</p>
    </div>

    <!-- Tabs / Sélection du rôle -->
    <div class="flex justify-center gap-4 mb-8">
      <!-- Acheteur -->
      <button
        type="button"
        [class.bg-blue-50]="selectedRole === 'acheteur'"
        [class.border-blue-500]="selectedRole === 'acheteur'"
        [class.text-blue-700]="selectedRole === 'acheteur'"
        class="flex flex-col items-center gap-2 flex-1 py-4 px-3 border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-colors"
        (click)="selectedRole = 'acheteur'"
      >
        <lucide-icon [img]="UserIcon" size="32" class="text-blue-600"></lucide-icon>
        <span class="text-sm font-medium">Acheteur</span>
      </button>

      <!-- Boutique -->
      <button
        type="button"
        [class.bg-indigo-50]="selectedRole === 'boutique'"
        [class.border-indigo-500]="selectedRole === 'boutique'"
        [class.text-indigo-700]="selectedRole === 'boutique'"
        class="flex flex-col items-center gap-2 flex-1 py-4 px-3 border-2 border-gray-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-colors"
        (click)="selectedRole = 'boutique'"
      >
        <lucide-icon [img]="StoreIcon" size="32" class="text-indigo-600"></lucide-icon>
        <span class="text-sm font-medium">Boutique</span>
      </button>

      <!-- Admin -->
      <button
        type="button"
        [class.bg-purple-50]="selectedRole === 'admin'"
        [class.border-purple-500]="selectedRole === 'admin'"
        [class.text-purple-700]="selectedRole === 'admin'"
        class="flex flex-col items-center gap-2 flex-1 py-4 px-3 border-2 border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-colors"
        (click)="selectedRole = 'admin'"
      >
        <lucide-icon [img]="UserCogIcon" size="32" class="text-purple-600"></lucide-icon>
        <span class="text-sm font-medium">Admin</span>
      </button>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <div class="mt-1">
          <input
            id="email"
            type="email"
            placeholder="votre@email.com"
            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-3 px-4"
            required
          />
        </div>
      </div>

      <!-- Mot de passe -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
        <div class="mt-1">
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-3 px-4"
            required
          />
        </div>
      </div>

      <!-- Bouton S'inscrire -->
      <div>
        <button
          type="submit"
          class="w-full py-3 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
        >
          S'inscrire
        </button>
      </div>
    </form>

    <!-- Lien vers connexion -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Déjà un compte ?
      <a routerLink="/connexion" class="font-medium text-blue-600 hover:text-blue-500">
        Se connecter
      </a>
    </p>
  </div>
</div>
